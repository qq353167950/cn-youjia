<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c11" />
    <title>油价</title>
    <style>
      /* 首屏底色与主题同步，避免启动瞬间闪白 */
      html[data-theme="dark"] { background: #0a0c11; }
      html[data-theme="light"] { background: #f2f3f7; }
      html, body { margin: 0; }
    </style>
    <script>
      /* 在首帧之前恢复上次主题，避免"先深色再跳浅色"的闪烁 */
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("yj.theme") || '"dark"');
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
